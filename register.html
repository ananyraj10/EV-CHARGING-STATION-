<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCharge | Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">⚡</div>

        <h1>PulseCharge</h1>
        <p class="subtitle">Smart Charging Management System</p>

        <h2>Create Account</h2>
        <p class="description">Register to monitor your EV charging station</p>

        <form id="registerForm">

            <div class="input-group">
                <label for="registerName">Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerPhone">Phone Number</label>
                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Enter phone number"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerPassword">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('registerPassword', this)">
                        👁
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)">
                        👁
                    </button>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                <span>I agree to the Terms & Conditions</span>
            </label>

            <button type="submit" class="auth-button">
                Create Account
            </button>

            <p id="registerMessage" class="message"></p>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="switch-page">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
