<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCharge | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">⚡</div>

        <h1>PulseCharge</h1>
        <p class="subtitle">Smart Charging Management System</p>

        <h2>Welcome Back</h2>
        <p class="description">Login to access your charging dashboard</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="loginPassword">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('loginPassword', this)">
                        👁
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" onclick="forgotPassword()">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-button">
                Login
            </button>

            <p id="loginMessage" class="message"></p>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="switch-page">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
